  <path d="M55 98 L55 110 L65 110 L65 98 Q60 100 55 98" fill="#2C2C2C"/>
  <rect x="28" y="95" width="34" height="15" rx="2.5" fill="#333"/>
  
  <!-- 白色帆布鞋 -->
  <rect x="22" y="108" width="18" height="9" rx="4" fill="#F5F5F5"/>
  <rect x="50" y="108" width="18" height="9" rx="4" fill="#F5F5F5"/>
  <rect x="22" y="108" width="18" height="2.5" rx="1.5" fill="#E8E8E8"/>
  <rect x="50" y="108" width="18" height="2.5" rx="1.5" fill="#E8E8E8"/>
  
