  <ellipse cx="41" cy="49" rx="0.8" ry="0.8" fill="white"/>
  <ellipse cx="55" cy="49" rx="0.8" ry="0.8" fill="white"/>
  
  <!-- 眉毛 -->
  <path d="M30 44 Q34 42 40 43" stroke="#5A7A3E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M50 43 Q56 42 60 44" stroke="#5A7A3E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- 嘴巴（有点欠揍的笑） -->
  <path d="M40 57 Q45 62 50 57" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- 耳朵 -->
  <ellipse cx="25" cy="48" rx="5" ry="7" fill="#F5E6D3"/>
  <ellipse cx="65" cy="48" rx="5" ry="7" fill="#F5E6D3"/>
  
