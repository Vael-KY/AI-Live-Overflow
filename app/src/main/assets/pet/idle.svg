  <ellipse cx="45" cy="30" rx="18" ry="15" fill="#7BA05B"/>
  
  <!-- 前额碎发 -->
  <path d="M30 43 Q35 33 40 40 Q43 35 45 41 Q47 35 52 40 Q55 33 60 43" fill="#6B8F4E"/>
  
  <!-- 紫眼睛 -->
  <ellipse cx="38" cy="50" rx="5" ry="5.5" fill="white"/>
